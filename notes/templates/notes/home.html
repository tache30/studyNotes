<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyNotes</title>
    <style>
        body {
            margin: 0;
            padding: 3rem 1.5rem;
            background: #f3f6f2;
            color: #20342d;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 680px;
            margin: 0 auto;
        }

        h1 {
            color: #28634f;
        }

        li {
            margin: 12px 0;
            line-height: 1.5;
        }

        form {
            display: grid;
            gap: 10px;
            margin: 24px 0;
        }

        textarea {
            padding: 10px;
            font: inherit;
        }

        button {
            width: fit-content;
            padding: 10px 16px;
            border: 0;
            background: #28634f;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>StudyNotes</h1>
        <p>Bun venit! Aici vom organiza notițele tale.</p>
        <form method="post">
            {% csrf_token %}
            <label for="content">Scrie o notiță</label>
            <textarea id="content" name="content" rows="4" required></textarea>
            <button type="submit">Salvează</button>
        </form>
        <h2>Notițele tale</h2>
        <ul>
            {% for note in notes %}
                <li>{{ note.content }}</li>
            {% empty %}
                <li>Nu ai notițe încă.</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
